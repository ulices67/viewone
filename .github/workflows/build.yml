name: iOS Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build and Archive
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build and Archive
        run: |
          # Compilar sin firma digital (Unsigned)
          xcodebuild clean archive \
            -project ViewOne.xcodeproj \
            -scheme ViewOne \
            -configuration Release \
            -archivePath $PWD/build/ViewOne.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Export IPA
        run: |
          # Empaquetar la aplicación en un archivo .ipa sin firma
          mkdir -p Payload
          cp -r build/ViewOne.xcarchive/Products/Applications/ViewOne.app Payload/
          zip -r ViewOne.ipa Payload
        
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ViewOne-IPA
          path: ViewOne.ipa
